name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tag and create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The org forbids GITHUB_TOKEN from creating pull requests, so
      # release-please runs as a GitHub App installed on this repo alone. The
      # token is minted per run and expires in an hour.
      #
      # This is not only a permissions workaround: a PR opened with
      # GITHUB_TOKEN does not trigger other workflows, so the release PR would
      # never report the `test (...)` checks that main's ruleset requires and
      # could never be merged. An App token does trigger them.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Keeps a release PR open, tracking every conventional commit landed on
      # main. Merging that PR bumps package.json, writes CHANGELOG.md, tags,
      # and cuts the GitHub Release — which sets release_created for the
      # publish steps below.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships older.
      - name: Update npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@latest

      # ponytail: no `npm ci` — this package has zero dependencies and no
      # lockfile. The old workflow ran it and died on every release.
      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      # No NODE_AUTH_TOKEN: auth comes from the OIDC token above. Requires a
      # trusted publisher on npmjs.com pointing at this repo + release.yml.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance --access public
