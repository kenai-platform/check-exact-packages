name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks out and runs tests. Fork PRs get
# a read-only token regardless, but being explicit keeps it that way.
permissions:
  contents: read

jobs:
  test:
    # The tool is bash + jq and runs on developer machines via pre-commit, so
    # macOS matters: its stock bash is 3.2.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm test
