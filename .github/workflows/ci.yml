name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks out and runs tests. Fork PRs get
# a read-only token regardless, but being explicit keeps it that way.
permissions:
  contents: read

jobs:
  test:
    # The tool is bash + jq and runs on developer machines via pre-commit, so
    # macOS matters: its stock bash is 3.2.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm test
